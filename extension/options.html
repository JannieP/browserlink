<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>BrowserLink</title>
<style>
  :root { color-scheme: light dark; --fg: #1b1b1f; --muted: #6b6b76; --bg: #ffffff; --line: #d9d9e0; --ok: #1a7f37; --bad: #b3261e; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e6e6ea; --muted: #9a9aa6; --bg: #1c1c20; --line: #3a3a42; --ok: #4ac26b; --bad: #f2867c; } }
  body { font: 13px/1.4 -apple-system, system-ui, sans-serif; color: var(--fg); background: var(--bg); margin: 0; padding: 14px; width: 300px; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  .status { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }
  .dot.on { background: var(--ok); }
  label { display: block; font-weight: 600; margin-bottom: 4px; }
  .row { display: flex; gap: 6px; }
  input { flex: 1; font: inherit; padding: 5px 7px; border: 1px solid var(--line); border-radius: 5px; background: transparent; color: inherit; }
  button { font: inherit; padding: 5px 10px; border: 1px solid var(--line); border-radius: 5px; background: transparent; color: inherit; cursor: pointer; }
  .hint { color: var(--muted); margin-top: 8px; font-size: 12px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 12px 0 0; color: var(--muted); font-size: 12px; }
  dd { margin: 0; overflow-wrap: anywhere; }
</style>
</head>
<body>
  <h1>BrowserLink</h1>
  <div class="status"><span class="dot" id="dot"></span><span id="state">checking…</span></div>
  <label for="name">Session name</label>
  <div class="row"><input id="name" placeholder="e.g. work" maxlength="40"><button id="save">Save</button></div>
  <div class="hint" id="hint">Claude addresses this profile by this name. Leave empty to use the Chrome profile name.</div>
  <dl><dt>Email</dt><dd id="email">—</dd><dt>Instance</dt><dd id="id">—</dd></dl>
  <script src="options.js"></script>
</body>
</html>
